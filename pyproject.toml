[project]
name = "visionforge"
version = "0.1.0"
description = "CIFAR-10 image classification with PyTorch"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Xiaoning Zhang", email = "xiaoning.zhang@outlook.com" },
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.2.2",
    "torchvision==0.17.2",
    "numpy<2",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.53.0",
    "python-multipart>=0.0.32",
    "pillow>=12.3.0",
]
[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "tensorboard>=2.21.0",
    "onnxruntime<1.20",
    "onnx>=1.22.0",
]
[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

# ---------- pytest ----------
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

# ---------- ruff ----------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = [
    "E501",  # line too long, 由 line-length 统一控制
    "B008",  # FastAPI depends on function calls in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["config", "data", "models", "training", "utils"]

# ---------- mypy ----------
[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
